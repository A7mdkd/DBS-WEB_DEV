<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <h1 id="logo">Website Logo</h1>
            <nav>
                <ul>
                    <li><a href="index.html" id="home-link">Home</a></li>
                    <li><a href="about.html" id="about-link">About</a></li>
                    <li><a href="services.html" id="services-link">Services</a></li>
                    <li><a href="gallery.html" id="gallery-link">Gallery</a></li>
                    <li><a href="contact.html" id="contact-link">Contact</a></li>
                </ul>
            </nav>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
            <button class="language-toggle" onclick="toggleLanguage()">🌐 العربية</button>
        </div>
    </header>

    <!-- Contact Section -->
    <section class="hero">
        <h1 id="contact-title">Contact Us</h1>
        <p id="contact-subtitle">We'd love to hear from you. Get in touch!</p>
    </section>

    <!-- Contact Form -->
    <section class="contact-card">
        <div class="container">
            <h2 id="send-us-message-title">Send Us a Message</h2>
            <form class="contact-form">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="Your Message" rows="5" required></textarea>
                <button type="submit" class="cta-btn" id="contact-button">Send Message</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 <span id="footer-name">Your Website Name</span>. All Rights Reserved. <a href="#" id="privacy-link">Privacy Policy</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
